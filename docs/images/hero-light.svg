<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="DSH Go Mac — 把运行当成界面">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7F9FE"/><stop offset="1" stop-color="#EDF2FB"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3B6EF5"/><stop offset="1" stop-color="#7C5CFA"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0B1220" stroke-opacity=".045"/>
  </pattern>
  <filter id="win" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <filter id="toast" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".30"/>
  </filter>
</defs>

<rect width="1200" height="600" fill="url(#bg)"/>
<rect width="1200" height="600" fill="url(#grid)"/>
<ellipse cx="930" cy="120" rx="360" ry="240" fill="#3B6EF5" opacity=".10"/>
<ellipse cx="520" cy="560" rx="320" ry="200" fill="#7C5CFA" opacity=".08"/>

<!-- left: wordmark -->
<text x="64" y="76" fill="#5C6C86" font-family="-apple-system, 'SF Pro Text', 'PingFang SC', Arial, sans-serif" font-size="11" letter-spacing="3.2">DSH GO MAC · MACOS</text>
<text x="61" y="164" fill="#0C1424" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.6">把「运行」</text>
<text x="61" y="234" fill="#0C1424" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.6">当成<tspan fill="url(#accent)">界面</tspan>。</text>
<text x="64" y="280" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17">DeepSeek Harness 的第二个 macOS 客户端。</text>
<text x="64" y="308" fill="#8595AC" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="17">同一个引擎，零迁移。过程信息、通知审批、原生动效。</text>

<rect x="64" y="344" width="72" height="3" rx="1.5" fill="url(#accent)"/>
<text x="64" y="384" fill="#5C6C86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">run 001 · macOS port</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
  <text x="64" y="408" fill="#8595AC">time</text>
  <text x="110" y="408" fill="#3B6EF5">0:09</text>
  <text x="176" y="408" fill="#8595AC">steps</text>
  <text x="226" y="408" fill="#0C1424">4</text>
  <text x="264" y="408" fill="#8595AC">files</text>
  <text x="308" y="408" fill="#0C1424">1</text>
  <text x="352" y="408" fill="#0EA371">●</text>
</g>
<g font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10" fill="#5C6C86">
  <rect x="64" y="448" width="96" height="26" rx="13" fill="#F3F6FC" stroke="#DCE4F2"/>
  <circle cx="82" cy="461" r="3" fill="#3B6EF5"/>
  <text x="94" y="465">官方 DSH</text>
  <rect x="172" y="448" width="84" height="26" rx="13" fill="#F3F6FC" stroke="#DCE4F2"/>
  <circle cx="190" cy="461" r="3" fill="#0EA371"/>
  <text x="202" y="465">内置引擎</text>
  <rect x="268" y="448" width="66" height="26" rx="13" fill="#F3F6FC" stroke="#DCE4F2"/>
  <circle cx="286" cy="461" r="3" fill="#7C5CFA"/>
  <text x="298" y="465">远程</text>
</g>

<!-- window -->
<g filter="url(#win)">
  <rect x="600" y="84" width="540" height="432" rx="18" fill="#FFFFFF" stroke="#DCE4F2" stroke-width="1"/>
</g>
<rect x="600" y="84" width="540" height="38" rx="18" fill="#F3F6FC"/>
<rect x="600" y="104" width="540" height="18" fill="#F3F6FC"/>
<circle cx="620" cy="103" r="5.5" fill="#FF5F57"/><circle cx="638" cy="103" r="5.5" fill="#FEBC2E"/><circle cx="656" cy="103" r="5.5" fill="#28C840"/>
<text x="676" y="107" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10.5">做个下载进度条</text>
<text x="1104" y="107" fill="#8595AC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">v1.0.17</text>

<!-- chat column -->
<g id="scene">
  <!-- active step indicator -->
  <rect x="610" y="258" width="2" height="18" rx="1" fill="#3B6EF5" opacity=".9">
    <animate attributeName="y" values="258;284;310;336;258" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <!-- user bubble -->
  <g>
    <rect x="616" y="142" width="300" height="64" rx="12" fill="#EAF1FF" stroke="#C9D9F8"/>
    <text x="630" y="164" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="11.5">做个下载进度条：写一个 <tspan font-family="ui-monospace, Menlo, monospace" fill="#3B6EF5">progress.py</tspan>，</text>
    <text x="630" y="181" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="11.5">每 0.5 秒打印一行，跑完告诉我结果。</text>
  </g>

  <!-- thinking pill -->
  <g>
    <rect x="616" y="218" width="300" height="26" rx="13" fill="#F3F6FC" stroke="#DCE4F2"/>
    <circle cx="630" cy="231" r="3" fill="#7C5CFA">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="640" y="235" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10.5">思考 · 决定调用 1 个工具</text>
    <text x="898" y="235" fill="#8595AC" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="end">1.8s</text>
    <rect x="616" y="246" width="300" height="2" rx="1" fill="#DCE4F2"/>
    <rect x="616" y="246" width="120" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- rows -->
  <g>
    <rect x="616" y="252" width="300" height="1" fill="#DCE4F2"/>
    <text x="620" y="274" fill="#3B6EF5" font-family="ui-monospace, Menlo, monospace" font-size="10">›_</text>
    <text x="640" y="274" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10.5">运行 · mkdir -p /tmp/dsh-demo</text>
    <text x="902" y="274" fill="#8595AC" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="end">0.1s</text>
  </g>
  <g>
    <text x="620" y="300" fill="#0EA371" font-family="ui-monospace, Menlo, monospace" font-size="10">+</text>
    <text x="640" y="300" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10.5">写入 · progress.py</text>
    <text x="902" y="300" fill="#0EA371" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="end">+28</text>
  </g>
  <g>
    <text x="620" y="326" fill="#3B6EF5" font-family="ui-monospace, Menlo, monospace" font-size="10">›_</text>
    <text x="640" y="326" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10.5">运行 · python3 progress.py</text>
    <text x="902" y="326" fill="#8595AC" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="end">0:03</text>
  </g>
  <g>
    <rect x="632" y="340" width="200" height="3" rx="1.5" fill="#DCE4F2"/>
    <rect x="632" y="340" width="168" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="840" y="346" fill="#5C6C86" font-family="ui-monospace, Menlo, monospace" font-size="8.5">18%</text>
  </g>
</g>

<!-- right detail panel -->
<g id="panel">
  <rect x="930" y="122" width="1" height="380" fill="#DCE4F2"/>
  <text x="946" y="146" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="11.5" font-weight="600">对话详情</text>
  <text x="946" y="166" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="9.5">共 1 轮 · 进行中</text>

  <!-- metrics -->
  <g font-family="ui-monospace, Menlo, monospace">
    <text x="946" y="200" fill="#0C1424" font-size="21" font-weight="600">0:09</text>
    <text x="946" y="216" fill="#8595AC" font-size="8.5" font-family="-apple-system, 'PingFang SC', Arial, sans-serif">用时</text>
    <text x="1010" y="200" fill="#0C1424" font-size="21" font-weight="600">4</text>
    <text x="1010" y="216" fill="#8595AC" font-size="8.5" font-family="-apple-system, 'PingFang SC', Arial, sans-serif">步骤</text>
    <text x="1062" y="200" fill="#0C1424" font-size="21" font-weight="600">1</text>
    <text x="1062" y="216" fill="#8595AC" font-size="8.5" font-family="-apple-system, 'PingFang SC', Arial, sans-serif">改动文件</text>
  </g>

  <!-- tabs -->
  <rect x="942" y="232" width="176" height="24" rx="12" fill="#F3F6FC"/>
  <rect id="tabhi" x="946" y="235" width="30" height="18" rx="9" fill="#DCE4F2">
    <animate attributeName="x" values="946;946;1000;1000" keyTimes="0;.62;.68;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <g fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="8.5">
    <text x="961" y="247" text-anchor="middle">轨迹</text>
    <text x="1000" y="247" text-anchor="middle">改动</text>
    <text x="1040" y="247" text-anchor="middle">文件</text>
    <text x="1080" y="247" text-anchor="middle">进度</text>
    <text x="1112" y="247" text-anchor="middle">上下文</text>
  </g>

  <!-- round card -->
  <rect x="940" y="268" width="184" height="148" rx="10" fill="#F3F6FC" stroke="#DCE4F2"/>
  <text x="952" y="286" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="8.5">第 1 轮 · 进行中</text>
  <text x="1112" y="286" fill="#8595AC" font-family="ui-monospace, Menlo, monospace" font-size="8" text-anchor="end">0:09</text>
  <g font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="8.5" fill="#5C6C86">
    <text x="952" y="308">思考 · 决定调用 1 个工具</text><text x="1112" y="308" text-anchor="end">1.8s</text>
    <text x="952" y="326">运行 · mkdir -p /tmp/dsh-demo</text><text x="1112" y="326" text-anchor="end">0.1s</text>
    <text x="952" y="344">写入 · progress.py</text><text x="1112" y="344" text-anchor="end">+28</text>
    <text x="952" y="362">运行 · python3 progress.py</text><text x="1112" y="362" text-anchor="end">0:03</text>
  </g>
  <rect x="952" y="378" width="160" height="2" rx="1" fill="#DCE4F2"/>
  <rect x="952" y="378" width="132" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- approval toast -->
<g id="toast" filter="url(#toast)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" keyTimes="0;.5;1" dur="4s" repeatCount="indefinite"/>
    <rect x="616" y="438" width="516" height="58" rx="14" fill="#FFFFFF" stroke="#DCE4F2"/>
    <circle cx="636" cy="460" r="8" fill="#3B6EF5" opacity=".18"/>
    <text x="633" y="464" fill="#3B6EF5" font-family="ui-monospace, Menlo, monospace" font-size="9">!</text>
    <text x="654" y="456" fill="#0C1424" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="10" font-weight="600">需要你确认</text>
    <text x="654" y="472" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="9">运行 python3 progress.py</text>
    <rect x="1004" y="452" width="52" height="24" rx="12" fill="#3B6EF5"/>
    <text x="1030" y="468" fill="#08101F" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">允许</text>
    <rect x="1062" y="452" width="52" height="24" rx="12" fill="none" stroke="#DCE4F2"/>
    <text x="1088" y="468" fill="#5C6C86" font-family="-apple-system, 'PingFang SC', Arial, sans-serif" font-size="9" text-anchor="middle">拒绝</text>
  </g>
</g>

</svg>