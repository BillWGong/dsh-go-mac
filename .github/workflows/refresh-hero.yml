name: refresh-hero

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release and stars
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | sed 's/^v//')
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.stargazers_count')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stars=$stars" >> "$GITHUB_OUTPUT"

      - name: Render hero
        env:
          HERO_VERSION: ${{ steps.meta.outputs.version }}
          HERO_STARS: ${{ steps.meta.outputs.stars }}
        run: python3 tooling/hero_svg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "hero is current"
            exit 0
          fi
          git add docs/images/hero-dark.svg docs/images/hero-light.svg
          git commit -m "chore: refresh hero (v${{ steps.meta.outputs.version }}, star ${{ steps.meta.outputs.stars }})"
          git push
